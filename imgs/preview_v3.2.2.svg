<svg xmlns="http://www.w3.org/2000/svg" width="520" height="490" viewBox="0 0 520 490" role="img" aria-labelledby="title desc">
  <title id="title">Backhaul Manager v3.2.2 interface preview</title>
  <desc id="desc">Terminal-style menu showing the Backhaul Manager server, client, diagnostics, maintenance, profiles, backups, health, logs, and link-test actions.</desc>
  <rect width="520" height="490" rx="12" fill="#101322"/>
  <text x="24" y="78" fill="#22d184" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="50" letter-spacing="-2">Backhaul</text>
  <text x="260" y="112" fill="#22d184" text-anchor="middle" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="15">Backhaul Manager</text>
  <text x="260" y="136" fill="#22d184" text-anchor="middle" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="14">v3.2.2</text>
  <text x="24" y="180" fill="#22d184" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="15" font-weight="700">Actions</text>
  <g fill="#22d184" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="14">
    <text x="24" y="205">1) Configure Iran server</text>
    <text x="24" y="226">2) Configure foreign client</text>
    <text x="24" y="247">3) Status</text>
    <text x="24" y="268">4) Diagnostics</text>
    <text x="24" y="289">5) Restart service</text>
    <text x="24" y="310">6) Start / stop service</text>
    <text x="24" y="331">7) Backhaul maintenance</text>
    <text x="24" y="352">8) Profiles</text>
    <text x="24" y="373">9) Backup &amp; migration</text>
    <text x="24" y="394">10) Health &amp; logs</text>
    <text x="24" y="415">11) Manager install / update</text>
    <text x="24" y="436">12) Uninstall / purge</text>
    <text x="24" y="457">13) Link test (check before tunneling)</text>
    <text x="24" y="478">0) Exit</text>
  </g>
  <rect x="24" y="484" width="9" height="3" fill="#22d184"/>
</svg>

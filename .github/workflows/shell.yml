name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n backhaul-manager.sh tests/test.sh
      - name: Run ShellCheck
        run: shellcheck backhaul-manager.sh tests/test.sh
      - name: Run regression and failure-injection tests
        run: bash tests/test.sh

name: Shell checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check Bash syntax
        run: bash -n backhaul-manager.sh test.sh tests/test.sh tests/test-v311.sh tests/test-v312.sh
      - name: Run ShellCheck
        run: |
          shellcheck backhaul-manager.sh test.sh tests/test-v311.sh tests/test-v312.sh
          shellcheck --exclude=SC2317,SC2034 tests/test.sh
      - name: Run regression and failure-injection tests
        run: |
          rc=0
          for suite in test.sh tests/test.sh tests/test-v311.sh tests/test-v312.sh; do
            echo "::group::${suite}"
            if bash "${suite}"; then
              echo "PASS: ${suite}"
            else
              suite_rc=$?
              echo "::error title=Regression suite failed::${suite} exited with ${suite_rc}"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "${rc}"
